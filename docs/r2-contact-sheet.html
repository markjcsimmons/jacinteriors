<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>R2 Contact Sheet (Local Tool)</title>
    <style>
      :root {
        --bg: #0b0f0e;
        --panel: #111716;
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.7);
        --stroke: rgba(255, 255, 255, 0.12);
        --accent: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji",
          "Segoe UI Emoji";
        background: linear-gradient(180deg, var(--bg), #050707);
        color: var(--text);
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(11, 15, 14, 0.9);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--stroke);
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 1.25rem;
      }

      h1 {
        font-size: 1.2rem;
        letter-spacing: -0.4px;
        margin: 0 0 0.75rem 0;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.85rem;
        align-items: start;
      }

      @media (max-width: 880px) {
        .controls {
          grid-template-columns: 1fr;
        }
      }

      label {
        display: block;
        font-size: 0.85rem;
        color: var(--muted);
        margin-bottom: 0.35rem;
      }

      input[type="text"],
      textarea {
        width: 100%;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--stroke);
        border-radius: 10px;
        padding: 0.8rem 0.9rem;
        outline: none;
      }

      textarea {
        min-height: 160px;
        resize: vertical;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 0.9rem;
        line-height: 1.35;
      }

      .btn-row {
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
        margin-top: 0.85rem;
      }

      button {
        appearance: none;
        border: 1px solid var(--stroke);
        background: transparent;
        color: var(--text);
        border-radius: 999px;
        padding: 0.65rem 0.95rem;
        font-weight: 700;
        letter-spacing: 0.2px;
        cursor: pointer;
      }

      button.primary {
        background: #ffffff;
        color: #0b0f0e;
        border-color: rgba(255, 255, 255, 0.6);
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .hint {
        font-size: 0.9rem;
        color: var(--muted);
        margin: 0.75rem 0 0 0;
      }

      .status {
        margin-top: 0.6rem;
        font-size: 0.9rem;
        color: var(--muted);
      }

      main .container {
        padding-top: 1.5rem;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      @media (max-width: 1100px) {
        .grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      @media (max-width: 780px) {
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 480px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }

      .tile {
        border: 1px solid var(--stroke);
        background: rgba(17, 23, 22, 0.7);
        border-radius: 12px;
        overflow: hidden;
        cursor: grab;
      }
      .tile:active {
        cursor: grabbing;
      }

      .thumb {
        width: 100%;
        aspect-ratio: 4 / 3;
        background: rgba(255, 255, 255, 0.06);
        display: block;
      }

      .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .meta {
        padding: 0.65rem 0.75rem;
        display: grid;
        gap: 0.35rem;
      }

      .name {
        font-size: 0.85rem;
        color: rgba(255, 255, 255, 0.82);
        word-break: break-word;
      }

      .url {
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.62);
        word-break: break-word;
      }

      .tile.drag-over {
        outline: 2px solid rgba(255, 255, 255, 0.7);
        outline-offset: 2px;
      }

      .tile a {
        color: inherit;
        text-decoration: none;
      }

      .error {
        color: rgba(255, 200, 200, 0.9);
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container">
        <h1>R2 Contact Sheet (local tool)</h1>
        <div class="controls">
          <div>
            <label for="baseUrl">Base URL (CDN or R2 public domain)</label>
            <input
              id="baseUrl"
              type="text"
              placeholder="https://jacinteriorscdn.com/projects/JAMM-visual/"
              value="https://jacinteriorscdn.com/projects/JAMM-visual/"
            />
            <p class="hint">
              Paste a folder base URL ending with <strong>/</strong>. Tiles will link to full-size images.
            </p>
            <div class="btn-row" style="margin-top: 0.6rem;">
              <button id="loadJammBtn" title="Loads images from the JAMM project page list">
                Load JAMM images
              </button>
            </div>
          </div>
          <div>
            <label for="keys">Object names / keys (one per line)</label>
            <textarea
              id="keys"
              placeholder="Example:\nJAMM-visual-1.jpg\nJAMM-visual-2.jpg\n...\n\nYou can also paste full keys like:\nprojects/JAMM-visual/JAMM-visual-1.jpg"
            ></textarea>
            <div class="btn-row">
              <button class="primary" id="renderBtn">Render grid</button>
              <button id="copyBtn" disabled>Copy ordered list</button>
              <button id="clearBtn">Clear</button>
            </div>
            <div class="status" id="status"></div>
          </div>
        </div>
      </div>
    </header>

    <main>
      <div class="container">
        <div class="grid" id="grid"></div>
      </div>
    </main>

    <script>
      (function () {
        "use strict";

        const baseEl = document.getElementById("baseUrl");
        const keysEl = document.getElementById("keys");
        const gridEl = document.getElementById("grid");
        const renderBtn = document.getElementById("renderBtn");
        const loadJammBtn = document.getElementById("loadJammBtn");
        const copyBtn = document.getElementById("copyBtn");
        const clearBtn = document.getElementById("clearBtn");
        const statusEl = document.getElementById("status");

        // Preset lists (generated from the corresponding project page image keys).
        const PRESET_JAMM = {
          base: "https://jacinteriorscdn.com/projects/JAMM-visual/",
          keys: [
            "JAMM-visual-1.jpg",
            "JAMM-visual-2.jpg",
            "JAMM-visual-3.jpg",
            "JAMM-visual-4.jpg",
            "JAMM-visual-5.jpg",
            "JAMM-visual-6.jpg",
            "JAMM-visual-7.jpg",
            "JAMM-visual-8.jpg",
            "JAMM-visual-9.jpg",
          ],
        };

        function normalizeBase(base) {
          const b = String(base || "").trim();
          if (!b) return "";
          return b.endsWith("/") ? b : b + "/";
        }

        function normalizeKeyLine(line) {
          const s = String(line || "").trim();
          if (!s) return "";
          // If user pasted full key like projects/JAMM-visual/file.jpg, keep only filename by default.
          // If they want to keep subpaths, they can set base URL to domain root and paste full keys.
          const parts = s.split("/");
          return parts.length > 1 ? parts[parts.length - 1] : s;
        }

        function buildUrl(base, key) {
          const safeBase = normalizeBase(base);
          if (!safeBase) return "";
          // Encode just the filename portion; base may include path.
          return safeBase + encodeURIComponent(key).replace(/%2F/g, "/");
        }

        function parseKeys() {
          const lines = String(keysEl.value || "")
            .split("\n")
            .map((l) => l.trim())
            .filter(Boolean);
          const keys = [];
          const seen = new Set();
          for (const line of lines) {
            const k = normalizeKeyLine(line);
            if (!k) continue;
            if (seen.has(k)) continue;
            seen.add(k);
            keys.push(k);
          }
          return keys;
        }

        function setStatus(msg) {
          statusEl.textContent = msg || "";
        }

        function makeTile(key, url) {
          const tile = document.createElement("div");
          tile.className = "tile";
          tile.draggable = true;
          tile.dataset.key = key;

          const a = document.createElement("a");
          a.href = url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";

          const frame = document.createElement("div");
          frame.className = "thumb";

          const img = document.createElement("img");
          img.loading = "lazy";
          img.decoding = "async";
          img.alt = key;
          img.src = url;

          frame.appendChild(img);
          a.appendChild(frame);
          tile.appendChild(a);

          const meta = document.createElement("div");
          meta.className = "meta";

          const name = document.createElement("div");
          name.className = "name";
          name.textContent = key;

          const u = document.createElement("div");
          u.className = "url";
          u.textContent = url;

          const err = document.createElement("div");
          err.className = "error";
          err.style.display = "none";
          err.textContent = "Failed to load (check base URL and filename).";

          img.addEventListener("error", () => {
            err.style.display = "block";
          });

          meta.appendChild(name);
          meta.appendChild(u);
          meta.appendChild(err);
          tile.appendChild(meta);

          return tile;
        }

        let dragSrc = null;

        function onDragStart(e) {
          dragSrc = e.currentTarget;
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", dragSrc.dataset.key || "");
        }

        function onDragOver(e) {
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          const over = e.currentTarget;
          if (!over || over === dragSrc) return;
          over.classList.add("drag-over");
        }

        function onDragLeave(e) {
          e.currentTarget.classList.remove("drag-over");
        }

        function onDrop(e) {
          e.preventDefault();
          const over = e.currentTarget;
          over.classList.remove("drag-over");
          if (!dragSrc || !over || dragSrc === over) return;

          const children = Array.from(gridEl.children);
          const srcIndex = children.indexOf(dragSrc);
          const overIndex = children.indexOf(over);
          if (srcIndex < 0 || overIndex < 0) return;

          if (srcIndex < overIndex) gridEl.insertBefore(dragSrc, over.nextSibling);
          else gridEl.insertBefore(dragSrc, over);

          setStatus("Reordered. Use “Copy ordered list” when ready.");
        }

        function wireDnD(tile) {
          tile.addEventListener("dragstart", onDragStart);
          tile.addEventListener("dragover", onDragOver);
          tile.addEventListener("dragleave", onDragLeave);
          tile.addEventListener("drop", onDrop);
        }

        function render() {
          const base = normalizeBase(baseEl.value);
          const keys = parseKeys();
          gridEl.innerHTML = "";

          if (!base) {
            setStatus("Enter a base URL first.");
            copyBtn.disabled = true;
            return;
          }

          if (!keys.length) {
            setStatus("Paste at least one filename/key.");
            copyBtn.disabled = true;
            return;
          }

          for (const key of keys) {
            const url = buildUrl(base, key);
            const tile = makeTile(key, url);
            wireDnD(tile);
            gridEl.appendChild(tile);
          }

          copyBtn.disabled = false;
          setStatus(
            `Rendered ${keys.length} images. Drag tiles to reorder, then click “Copy ordered list”.`
          );
        }

        async function copyOrderedList() {
          const keys = Array.from(gridEl.querySelectorAll(".tile")).map((t) => t.dataset.key || "");
          const text = keys.filter(Boolean).join("\n") + "\n";
          try {
            await navigator.clipboard.writeText(text);
            setStatus("Copied ordered list to clipboard.");
          } catch (e) {
            // Fallback: select in a prompt
            window.prompt("Copy this ordered list:", text);
            setStatus("Clipboard blocked; used prompt fallback.");
          }
        }

        function clearAll() {
          keysEl.value = "";
          gridEl.innerHTML = "";
          copyBtn.disabled = true;
          setStatus("");
        }

        renderBtn.addEventListener("click", render);
        loadJammBtn.addEventListener("click", () => {
          baseEl.value = PRESET_JAMM.base;
          keysEl.value = PRESET_JAMM.keys.join("\n") + "\n";
          render();
        });
        copyBtn.addEventListener("click", copyOrderedList);
        clearBtn.addEventListener("click", clearAll);

        // Auto-render if keys are already present (convenience).
        try {
          if ((keysEl.value || "").trim()) render();
        } catch (_) {}
      })();
    </script>
  </body>
</html>
