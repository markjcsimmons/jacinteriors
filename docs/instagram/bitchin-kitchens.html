  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
    }

    /* ─── CHROME ─── */
    .hdr {
      background: #0c0c0c;
      border-bottom: 1px solid #222;
      padding: 11px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
      min-height: 48px;
    }
    .hdr-brand {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #444;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .sep { color: #2a2a2a; font-size: 18px; }
    .tabs { display: flex; gap: 5px; flex-wrap: wrap; }
    .tab {
      padding: 5px 11px;
      border: 1px solid #2a2a2a;
      border-radius: 2px;
      background: none;
      color: #555;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .tab:hover { border-color: #555; color: #bbb; }
    .tab.on { background: #222a26; border-color: #2e3830; color: #fff; }
    .hdr-r { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .slide-info { font-size: 11px; color: #444; white-space: nowrap; }
    .export-btn {
      padding: 5px 13px;
      background: none;
      border: 1px solid #2a2a2a;
      border-radius: 2px;
      color: #666;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .export-btn:hover { border-color: #666; color: #ccc; }

    /* ─── STAGE ─── */
    .stage {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #111;
    }
    .scale-wrap {
      position: absolute;
      transform-origin: top left;
      width: 1080px;
      height: 1080px;
    }

    /* ─── FOOTER ─── */
    .ftr {
      background: #0c0c0c;
      border-top: 1px solid #222;
      padding: 11px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      min-height: 48px;
    }
    .nav-btn {
      padding: 6px 18px;
      background: none;
      border: 1px solid #2a2a2a;
      border-radius: 2px;
      color: #777;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.03em;
    }
    .nav-btn:hover:not(:disabled) { border-color: #666; color: #ddd; }
    .nav-btn:disabled { opacity: 0.2; cursor: default; }
    .ftr-center { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .dots { display: flex; gap: 7px; align-items: center; }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #2a2a2a;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
      padding: 0;
    }
    .dot:hover { background: #555; }
    .dot.on { background: #fff; }
    .post-name { font-size: 10px; color: #444; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }

    /* ═══════════════════════════════════════════
       SLIDE STYLES — 1080 × 1080
    ═══════════════════════════════════════════ */
    .slide {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .dark { background: #222a26; }
    .light { background: #ffffff; }

    /* ── Universal furniture ── */
    .s-label {
      position: absolute;
      top: 52px; left: 60px;
      font-size: 12px; font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .dark .s-label { color: rgba(255,255,255,0.28); }
    .light .s-label { color: #c0c0c0; }

    .s-num {
      position: absolute;
      top: 52px; right: 60px;
      font-size: 12px; font-weight: 400;
    }
    .dark .s-num { color: rgba(255,255,255,0.2); }
    .light .s-num { color: #cccccc; }

    .s-handle {
      position: absolute;
      bottom: 50px; right: 60px;
      font-size: 13px; font-weight: 500;
      letter-spacing: 0.04em;
    }
    .dark .s-handle { color: rgba(255,255,255,0.25); }
    .light .s-handle { color: #d0d0d0; }

    /* ── TITLE slide ── */
    .l-title {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      justify-content: flex-end;
      padding: 0 60px 96px;
    }
    .t-bar {
      width: 52px; height: 3px;
      background: rgba(255,255,255,0.18);
      margin-bottom: 48px;
    }
    .t-hed {
      font-size: 108px;
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -7px;
      color: #ffffff;
      margin-bottom: 36px;
    }
    .t-sub {
      font-size: 22px; font-weight: 400;
      color: rgba(255,255,255,0.5);
      line-height: 1.45;
      letter-spacing: -0.2px;
      max-width: 580px;
    }

    /* ── TYPE-ONLY slide ── */
    .l-type {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      justify-content: center;
      padding: 0 60px;
    }
    .c-rule {
      width: 40px; height: 1px;
      background: #e0e0e0;
      margin-bottom: 44px;
    }
    .c-hed {
      font-size: 72px;
      font-weight: 700;
      line-height: 0.97;
      letter-spacing: -5px;
      color: #222a26;
      margin-bottom: 32px;
    }
    .c-body {
      font-size: 22px; font-weight: 400;
      line-height: 1.55;
      color: #575757;
      letter-spacing: -0.25px;
      max-width: 740px;
    }

    /* ── SPLIT (photo + type) slide ── */
    .l-split {
      position: absolute; inset: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .sp-photo {
      position: relative;
      overflow: hidden;
      background: #1a1a1a;
    }
    .sp-photo img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    .sp-ph {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px;
    }
    .ph-icon {
      width: 44px; height: 44px;
      border: 1px solid #333; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #333; font-size: 20px;
    }
    .ph-label {
      font-size: 10px; font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #383838;
      text-align: center;
      padding: 0 24px;
    }
    .sp-copy {
      display: flex; flex-direction: column;
      justify-content: center;
      padding: 80px 56px 80px 60px;
    }
    .sp-hed {
      font-size: 52px;
      font-weight: 700;
      line-height: 1.0;
      letter-spacing: -3px;
      color: #222a26;
      margin-bottom: 28px;
    }
    .sp-body {
      font-size: 20px; font-weight: 400;
      line-height: 1.55;
      color: #575757;
      letter-spacing: -0.2px;
    }

    /* ── CTA slide ── */
    .l-cta {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      justify-content: center;
      padding: 0 60px;
    }
    .cta-tag {
      font-size: 11px; font-weight: 500;

      text-transform: uppercase;

      font-weight: 700;

    .cta-div {

    .cta-sub {

      color: rgba(255,255,255,0.45);
      line-height: 1.55;
      letter-spacing: -0.2px;
    }
  </style>
</head>

// ─── STATE ───────────────────────────────────
let pIdx = 0, sIdx = 0;

// ─── RENDER ──────────────────────────────────
function html(d, n, total) {
  const num = `${String(n).padStart(2,'0')} / ${String(total).padStart(2,'0')}`;
  const label = `<div class="s-label">Bitchin' Kitchens</div>`;
  const numEl = (n > 1 && n < total) ? `<div class="s-num">${num}</div>` : '';
  const handle = `<div class="s-handle">@jacinteriors</div>`;

  if (d.t === 'title') return `
    <div class="slide dark">
      ${label}
      <div class="l-title">
        <div class="t-bar"></div>
        <div class="t-hed">${d.hed}</div>
        <div class="t-sub">${d.sub}</div>
      </div>
      ${handle}
    </div>`;

  if (d.t === 'type') return `
    <div class="slide light">
      ${label}${numEl}
      <div class="l-type">
        <div class="c-rule"></div>
        <div class="c-hed">${d.hed}</div>
        <div class="c-body">${d.body}</div>
      </div>
      ${handle}
    </div>`;

  if (d.t === 'split') return `
    <div class="slide light">
      ${label}${numEl}
      <div class="l-split">
        <div class="sp-photo">
          <div class="sp-ph">
            <div class="ph-icon">+</div>
            <div class="ph-label">${d.ph}</div>
          </div>
          <img src="${d.img}" alt="${d.ph}" onload="this.previousElementSibling.style.opacity=0">
        </div>
        <div class="sp-copy">
          <div class="c-rule"></div>
          <div class="sp-hed">${d.hed}</div>
          <div class="sp-body">${d.body}</div>
        </div>
      </div>
      ${handle}
    </div>`;

  if (d.t === 'cta') return `
    <div class="slide dark">
      ${label}
      <div class="l-cta">
        <div class="cta-tag">Get started</div>
        <div class="cta-hed">${d.hed}</div>
        <div class="cta-div"></div>
        <div class="cta-sub">${d.sub}</div>
      </div>
      ${handle}
    </div>`;
}

function render() {
  const post = POSTS[pIdx];
  const d = post.slides[sIdx];
  const total = post.slides.length;

  document.getElementById('slide').outerHTML; // noop
  document.querySelector('.scale-wrap').innerHTML =
    `<div id="slide">${html(d, sIdx+1, total)}</div>`;

  document.getElementById('info').textContent =
    `Post ${pIdx+1} / ${POSTS.length}  ·  Slide ${sIdx+1} / ${total}`;
  document.getElementById('pname').textContent = post.name;

  // Dots
  document.getElementById('dots').innerHTML = post.slides.map((_,i) =>
    `<button class="dot${i===sIdx?' on':''}" onclick="jump(${i})"></button>`).join('');

  // Tabs
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('on', i===pIdx));

  // Nav
  const first = pIdx===0 && sIdx===0;
  const last  = pIdx===POSTS.length-1 && sIdx===POSTS[pIdx].slides.length-1;
  document.getElementById('prevBtn').disabled = first;
  document.getElementById('nextBtn').disabled = last;

  fit();
}

function fit() {
  const stage = document.getElementById('stage');
  const sw = stage.offsetWidth - 40;
  const sh = stage.offsetHeight - 40;
  const s = Math.min(sw/1080, sh/1080, 1);
  const x = (stage.offsetWidth  - 1080*s) / 2;
  const y = (stage.offsetHeight - 1080*s) / 2;
  const w = document.querySelector('.scale-wrap');
  w.style.transform = `translate(${x}px,${y}px) scale(${s})`;
  w.style.transformOrigin = 'top left';
}

function go(dir) {
  const total = POSTS[pIdx].slides.length;
  if (dir===1) {
    if (sIdx < total-1) { sIdx++; }
    else if (pIdx < POSTS.length-1) { pIdx++; sIdx=0; }
  } else {
    if (sIdx > 0) { sIdx--; }
    else if (pIdx > 0) { pIdx--; sIdx = POSTS[pIdx].slides.length-1; }
  }
  render();
}

function jump(i) { sIdx=i; render(); }

function goPost(i) { pIdx=i; sIdx=0; render(); }

function openFull() {
  const inner = document.querySelector('#slide .slide').outerHTML;
  const styles = Array.from(document.querySelectorAll('style'))
    .map(s => s.outerHTML).join('\n');
  const w = window.open('','_blank','width=1080,height=1080');
  w.document.write(`<!DOCTYPE html><html><head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    ${styles}
    <style>html,body{width:1080px;height:1080px;overflow:hidden;margin:0;padding:0;background:#fff;}</style>
    </head><body>${inner}</body></html>`);
  w.document.close();
}

// ─── INIT ────────────────────────────────────
(function init() {
  document.getElementById('tabs').innerHTML = POSTS.map((p,i) =>
    `<button class="tab${i===0?' on':''}" onclick="goPost(${i})">${p.id} · ${p.name}</button>`
  ).join('');
  render();
  window.addEventListener('resize', fit);
  document.addEventListener('keydown', e => {
    if (e.key==='ArrowRight'||e.key==='ArrowDown') go(1);
    if (e.key==='ArrowLeft' ||e.key==='ArrowUp')   go(-1);
  });
})();
</script>
</body>
</html>
