<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A curated gallery of JAC Interiors projects — refined, timeless spaces across Los Angeles and South Florida."
    />
    <title>Gallery | JAC Interiors</title>
    <link rel="stylesheet" href="assets/css/style.css?v=20260209-2" />
    <link rel="stylesheet" href="assets/css/spaces-masonry.css?v=20260210-2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script defer src="assets/js/spaces-masonry.js?v=20260210-1"></script>
    <script src="assets/js/r2-config.js?v=20260209-2"></script>
    <script defer src="assets/js/r2-images.js?v=20260209-2"></script>
    <script src="assets/js/load-navbar.js?v=20260209-1" defer></script>
    <script src="assets/js/gallery.js?v=20260210-7" defer></script>
  </head>
  <body>
    <main>
      <section style="padding: 3rem 0; background: #1a1a1a; color: white; margin-top: 0;">
        <div class="container">
          <div class="project-header-row">
            <h1
              class="scroll-fade-in"
              style="
                font-size: 3.5rem;
                font-weight: 500;
                margin: 0;
                letter-spacing: -1.5px;
                line-height: 1.1;
                color: white;
              "
            >
              Gallery
            </h1>
            <p
              class="scroll-fade-in"
              style="
                font-size: 16px;
                color: #ccc;
                line-height: 1.6;
                font-weight: 400;
                max-width: 700px;
                margin: 1rem 0 0 0;
              "
            >
              Click any image to see the project
            </p>
          </div>
        </div>
      </section>

      <section style="padding: 4rem 0;" aria-label="Project image gallery">
        <div class="container" style="max-width: 1400px;">
          <div id="galleryGrid" class="image-gallery-grid gallery-masonry-grid" style="margin-bottom: 2rem;" aria-live="polite">
            <noscript>
              <p style="color: rgba(34, 42, 38, 0.75); font-size: 1rem; line-height: 1.6">
                Please enable JavaScript to view the gallery.
              </p>
            </noscript>
          </div>

          <div style="display: flex; justify-content: center; margin-top: 2.75rem;">
            <button id="galleryLoadMore" class="btn btn-primary" type="button" style="padding: 0.95rem 2.25rem;">
              Load more
            </button>
          </div>
        </div>
      </section>
    </main>
    <script src="assets/js/main.js"></script>
  </body>
